name: test

# On every pull request, but only on push to master
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack / pinned Yarn
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build code
        run: yarn build

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run Node tests
        run: yarn test-node

      - name: Run headless tests with coverage
        run: yarn cover

      - name: Run lint
        run: yarn lint

      - name: Coveralls
        if: matrix.node-version == 24
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  # Keep a stable required check name while the test matrix expands over
  # multiple Node.js versions.
  test:
    if: ${{ always() }}
    needs: test-matrix
    runs-on: ubuntu-22.04
    steps:
      - name: Fail if any matrix job failed
        if: ${{ needs.test-matrix.result != 'success' }}
        run: exit 1
      - name: All test matrix jobs passed
        run: echo "All test matrix jobs passed"
