name: release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.repository == 'visgl/probe.gl' && (github.event_name == 'push' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Verify release commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          node scripts/check-release-package.mjs

      - name: Update npm and enable Corepack
        run: |
          npm install --global npm@^11.15.0 corepack@0.35.0
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn build

      - name: Verify package exports and types
        run: yarn test-package

      - name: Run Node tests
        run: yarn test-node

      - name: Inspect package contents
        working-directory: modules/core
        run: npm pack --dry-run

      - name: Select npm distribution tag
        id: distribution
        run: node scripts/get-release-tag.mjs >> "$GITHUB_OUTPUT"

      - name: Publish probe.gl with npm trusted publishing
        working-directory: modules/core
        run: npm publish --access public --provenance --tag "${{ steps.distribution.outputs.tag }}"
